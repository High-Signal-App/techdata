name: Deploy (manual)

# Owner-approved deploys only. Never runs on push. Needs CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID secrets. PUBLIC_SITE_URL is a repository Actions variable
# for the public deployment origin used by prerendered page canonicals.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy techdata" to confirm
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy techdata' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm exec wrangler deploy --tag "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
