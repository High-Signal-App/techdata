name: Deploy (manual)

# Owner-approved deploys only. Never runs on push. Needs CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID and UI_LIBRARY_TOKEN secrets, none of which exist yet.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy techdata" to confirm
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy techdata' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - env:
          UI_LIBRARY_TOKEN: ${{ secrets.UI_LIBRARY_TOKEN }}
        run: git config --global url."https://x-access-token:${UI_LIBRARY_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
